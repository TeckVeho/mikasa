# Cloud Build — dev API only (faster when frontend unchanged)
#
# Builds+pushes mikasa-api image, runs prisma migrations via mikasa-load-management-migrate-dev job,
# then deploys mikasa-load-management-api-dev Cloud Run service.
#
# Migrate job config (VPC, Cloud SQL, secrets) is owned by Terraform — CI only updates image.
#
# Submit from mikasa monorepo root:
#   gcloud builds submit --config=google-cloud/cloudbuild/cloudbuild.dev.api.yaml \
#     --substitutions=_AR_PROJECT_ID=mikasa-load-management,_DEPLOY_PROJECT_ID=mikasa-load-management .

steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -eo pipefail
        export DOCKER_CLI_EXPERIMENTAL=enabled
        docker buildx inspect mikasa-builder >/dev/null 2>&1 \
          || docker buildx create --name mikasa-builder --driver docker-container --use
        docker buildx use mikasa-builder
        docker pull ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/mikasa-api:${_TAG} || true
        docker pull ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/mikasa-api:buildcache || true
        docker buildx build -f apps/api/Dockerfile \
          --cache-from=type=registry,ref=${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/mikasa-api:buildcache \
          --cache-from=type=registry,ref=${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/mikasa-api:${_TAG} \
          --cache-to=type=registry,ref=${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/mikasa-api:buildcache,mode=max \
          -t ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/mikasa-api:${_TAG} \
          --push \
          .
    dir: '.'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - '${_MIGRATE_JOB_NAME}'
      - '--project'
      - '${_DEPLOY_PROJECT_ID}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/mikasa-api:${_TAG}'
      - '--region'
      - '${_REGION}'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - '${_MIGRATE_JOB_NAME}'
      - '--project'
      - '${_DEPLOY_PROJECT_ID}'
      - '--region'
      - '${_REGION}'
      - '--wait'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_API_SERVICE_NAME}'
      - '--project'
      - '${_DEPLOY_PROJECT_ID}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/mikasa-api:${_TAG}'
      - '--region'
      - '${_REGION}'
      - '--timeout'
      - '${_API_TIMEOUT}'
      - '--memory'
      - '${_API_MEMORY}'
      - '--no-allow-unauthenticated'

substitutions:
  _REGION: asia-northeast1
  _TAG: dev
  _AR_PROJECT_ID: ''
  _DEPLOY_PROJECT_ID: ''
  _API_TIMEOUT: '3600'
  _API_MEMORY: '512Mi'
  _MIGRATE_JOB_NAME: mikasa-load-management-migrate-dev
  _API_SERVICE_NAME: mikasa-load-management-api-dev

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM
