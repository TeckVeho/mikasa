# Cloud Build — API + migrate job + web + worker (single submit = one build VM).
#
# Builds API, web, and worker images in parallel. Migrate job config is owned by Terraform.

steps:
  - id: setup-buildx
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -eo pipefail
        export DOCKER_CLI_EXPERIMENTAL=enabled
        docker buildx inspect logivoice-builder >/dev/null 2>&1 \
          || docker buildx create --name logivoice-builder --driver docker-container --use
        docker buildx use logivoice-builder
    waitFor: ['-']

  - id: build-api
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -eo pipefail
        export DOCKER_CLI_EXPERIMENTAL=enabled
        docker buildx use logivoice-builder
        docker pull ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/logivoice-api:${_TAG} || true
        docker pull ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/logivoice-api:buildcache || true
        docker buildx build -f apps/api/Dockerfile \
          --cache-from=type=registry,ref=${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/logivoice-api:buildcache \
          --cache-from=type=registry,ref=${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/logivoice-api:${_TAG} \
          --cache-to=type=registry,ref=${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/logivoice-api:buildcache,mode=max \
          -t ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/logivoice-api:${_TAG} \
          --push \
          .
    dir: '.'
    waitFor: ['setup-buildx']

  - id: build-web
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -eo pipefail
        export DOCKER_CLI_EXPERIMENTAL=enabled
        docker buildx use logivoice-builder
        docker pull ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/logivoice-web:${_TAG} || true
        docker pull ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/logivoice-web:buildcache || true
        docker buildx build -f apps/web/Dockerfile \
          --build-arg NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL} \
          --build-arg NEXT_PUBLIC_BASE_URL=${_NEXT_PUBLIC_BASE_URL} \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY} \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN} \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID} \
          --cache-from=type=registry,ref=${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/logivoice-web:buildcache \
          --cache-from=type=registry,ref=${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/logivoice-web:${_TAG} \
          --cache-to=type=registry,ref=${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/logivoice-web:buildcache,mode=max \
          -t ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/logivoice-web:${_TAG} \
          --push \
          .
    dir: '.'
    waitFor: ['setup-buildx']

  - id: build-worker
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -eo pipefail
        export DOCKER_CLI_EXPERIMENTAL=enabled
        docker buildx use logivoice-builder
        docker pull ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/logivoice-worker:${_TAG} || true
        docker pull ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/logivoice-worker:buildcache || true
        docker buildx build -f apps/worker/Dockerfile \
          --cache-from=type=registry,ref=${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/logivoice-worker:buildcache \
          --cache-from=type=registry,ref=${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/logivoice-worker:${_TAG} \
          --cache-to=type=registry,ref=${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/logivoice-worker:buildcache,mode=max \
          -t ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/logivoice-worker:${_TAG} \
          --push \
          .
    dir: '.'
    waitFor: ['setup-buildx']

  - id: migrate-update
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'dx-logivoice-migrate-dev'
      - '--project'
      - '${_DEPLOY_PROJECT_ID}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/logivoice-api:${_TAG}'
      - '--region'
      - '${_REGION}'
    waitFor: ['build-api']

  - id: migrate-execute
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'dx-logivoice-migrate-dev'
      - '--project'
      - '${_DEPLOY_PROJECT_ID}'
      - '--region'
      - '${_REGION}'
      - '--wait'
    waitFor: ['migrate-update']

  - id: deploy-api
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'dx-logivoice-api-dev'
      - '--project'
      - '${_DEPLOY_PROJECT_ID}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/logivoice-api:${_TAG}'
      - '--region'
      - '${_REGION}'
      - '--timeout'
      - '${_API_TIMEOUT}'
      - '--memory'
      - '${_API_MEMORY}'
      - '--no-allow-unauthenticated'
    waitFor: ['migrate-execute']

  - id: deploy-web
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'dx-logivoice-web-dev'
      - '--project'
      - '${_DEPLOY_PROJECT_ID}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/logivoice-web:${_TAG}'
      - '--region'
      - '${_REGION}'
      - '--no-allow-unauthenticated'
    waitFor: ['build-web']

  - id: deploy-worker
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_WORKER_SERVICE_NAME}'
      - '--project'
      - '${_DEPLOY_PROJECT_ID}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/logivoice-worker:${_TAG}'
      - '--region'
      - '${_REGION}'
      - '--no-allow-unauthenticated'
    waitFor: ['build-worker']

substitutions:
  _REGION: asia-northeast1
  _TAG: dev
  _AR_PROJECT_ID: ''
  _DEPLOY_PROJECT_ID: ''
  _API_TIMEOUT: '3600'
  _API_MEMORY: '512Mi'
  _WORKER_SERVICE_NAME: dx-logivoice-worker-dev
  _NEXT_PUBLIC_API_URL: 'https://dx-logivoice-api-dev-739321310569.asia-northeast1.run.app'
  _NEXT_PUBLIC_BASE_URL: 'https://dx-logivoice-web-dev-739321310569.asia-northeast1.run.app'
  _NEXT_PUBLIC_FIREBASE_API_KEY: ''
  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ''
  _NEXT_PUBLIC_FIREBASE_PROJECT_ID: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM
