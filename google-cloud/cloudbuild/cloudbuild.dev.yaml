# Cloud Build — dev API + migrate job + web (single submit = one build VM).
#
# Mikasa dev: API and Web only (no worker — enable_worker=false in Terraform).

steps:
  - id: setup-buildx
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -eo pipefail
        export DOCKER_CLI_EXPERIMENTAL=enabled
        docker buildx inspect mikasa-builder >/dev/null 2>&1 \
          || docker buildx create --name mikasa-builder --driver docker-container --use
        docker buildx use mikasa-builder
    waitFor: ['-']

  - id: build-api
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -eo pipefail
        export DOCKER_CLI_EXPERIMENTAL=enabled
        docker buildx use mikasa-builder
        docker pull ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/mikasa-api:${_TAG} || true
        docker pull ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/mikasa-api:buildcache || true
        docker buildx build -f apps/api/Dockerfile \
          --cache-from=type=registry,ref=${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/mikasa-api:buildcache \
          --cache-from=type=registry,ref=${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/mikasa-api:${_TAG} \
          --cache-to=type=registry,ref=${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/mikasa-api:buildcache,mode=max \
          -t ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/mikasa-api:${_TAG} \
          --push \
          .
    dir: '.'
    waitFor: ['setup-buildx']

  - id: build-web
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -eo pipefail
        export DOCKER_CLI_EXPERIMENTAL=enabled
        docker buildx use mikasa-builder
        docker pull ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/mikasa-web:${_TAG} || true
        docker pull ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/mikasa-web:buildcache || true
        docker buildx build -f apps/web/Dockerfile \
          --build-arg NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL} \
          --build-arg NEXT_PUBLIC_BASE_URL=${_NEXT_PUBLIC_BASE_URL} \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=${_NEXT_PUBLIC_FIREBASE_API_KEY} \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN} \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_NEXT_PUBLIC_FIREBASE_PROJECT_ID} \
          --cache-from=type=registry,ref=${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/mikasa-web:buildcache \
          --cache-from=type=registry,ref=${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/mikasa-web:${_TAG} \
          --cache-to=type=registry,ref=${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/mikasa-web:buildcache,mode=max \
          -t ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/mikasa-web:${_TAG} \
          --push \
          .
    dir: '.'
    waitFor: ['setup-buildx']

  - id: migrate-update
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - '${_MIGRATE_JOB_NAME}'
      - '--project'
      - '${_DEPLOY_PROJECT_ID}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/mikasa-api:${_TAG}'
      - '--region'
      - '${_REGION}'
    waitFor: ['build-api']

  - id: migrate-execute
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - '${_MIGRATE_JOB_NAME}'
      - '--project'
      - '${_DEPLOY_PROJECT_ID}'
      - '--region'
      - '${_REGION}'
      - '--wait'
    waitFor: ['migrate-update']

  - id: deploy-api
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_API_SERVICE_NAME}'
      - '--project'
      - '${_DEPLOY_PROJECT_ID}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/mikasa-api:${_TAG}'
      - '--region'
      - '${_REGION}'
      - '--timeout'
      - '${_API_TIMEOUT}'
      - '--memory'
      - '${_API_MEMORY}'
      - '--no-allow-unauthenticated'
    waitFor: ['migrate-execute']

  - id: deploy-web
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_WEB_SERVICE_NAME}'
      - '--project'
      - '${_DEPLOY_PROJECT_ID}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_AR_PROJECT_ID}-docker/mikasa-web:${_TAG}'
      - '--region'
      - '${_REGION}'
      - '--allow-unauthenticated'
    waitFor: ['build-web']

substitutions:
  _REGION: asia-northeast1
  _TAG: dev
  _AR_PROJECT_ID: ''
  _DEPLOY_PROJECT_ID: ''
  _API_TIMEOUT: '3600'
  _API_MEMORY: '512Mi'
  _MIGRATE_JOB_NAME: mikasa-lm-dev-migrate-dev
  _API_SERVICE_NAME: mikasa-lm-dev-api-dev
  _WEB_SERVICE_NAME: mikasa-lm-dev-web-dev
  _NEXT_PUBLIC_API_URL: ''
  _NEXT_PUBLIC_BASE_URL: ''
  _NEXT_PUBLIC_FIREBASE_API_KEY: ''
  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ''
  _NEXT_PUBLIC_FIREBASE_PROJECT_ID: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM
