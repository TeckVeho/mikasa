name: CI E2E

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ci-e2e-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: misaki_root
          MYSQL_DATABASE: misaki
          MYSQL_USER: misaki
          MYSQL_PASSWORD: misaki
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pmisaki_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      CI: true
      DATABASE_URL: mysql://misaki:misaki@127.0.0.1:3306/misaki

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare database and web env
        run: node scripts/e2e-prepare.mjs

      - name: Install Playwright browsers
        run: npm run test:e2e:install -w @logivoice/web

      - name: Run E2E tests
        run: npm run test:e2e:only -w @logivoice/web
