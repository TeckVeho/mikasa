# Unit tests for mikasa monorepo (Vitest via Turbo).
name: CI Test

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ci-test-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Turbo test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Run tests
        run: npm test
