services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: logivoice_root
      MYSQL_DATABASE: logivoice
      MYSQL_USER: logivoice
      MYSQL_PASSWORD: logivoice
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
