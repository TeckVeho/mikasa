services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: misaki_root
      MYSQL_DATABASE: misaki
      MYSQL_USER: misaki
      MYSQL_PASSWORD: misaki
    ports:
      - "3306:3306"
    volumes:
      - misaki_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  misaki_mysql_data:
