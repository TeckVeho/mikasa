# Cloud Build — dev API only (faster when frontend unchanged)
#
# Builds+pushes logivoice-api image, runs prisma migrations via logivoice-migrate-dev job,
# then deploys logivoice-api-dev Cloud Run service.
#
# Submit from LogiVoice monorepo root (`docker build` context `.`). Always pass
# _AR_PROJECT_ID (Artifact Registry project) and _DEPLOY_PROJECT_ID (Cloud Run
# target project) when using shared registry / cross-project deploy.
#
#   gcloud builds submit --config=cloudbuild/cloudbuild.dev.api.yaml \
#     --substitutions=_AR_PROJECT_ID=your-common-project,_DEPLOY_PROJECT_ID=your-dev-project .

steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        export DOCKER_CLI_EXPERIMENTAL=enabled
        docker buildx create --use --name cloudbuilder
        docker buildx build -f apps/api/Dockerfile \
          --cache-from=type=registry,ref=${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_REPO}/logivoice-api:buildcache \
          --cache-to=type=registry,ref=${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_REPO}/logivoice-api:buildcache,mode=max \
          -t ${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_REPO}/logivoice-api:${_TAG} \
          --push \
          .
    dir: '.'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'logivoice-migrate-dev'
      - '--project'
      - '${_DEPLOY_PROJECT_ID}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_REPO}/logivoice-api:${_TAG}'
      - '--region'
      - '${_REGION}'
      - '--command'
      - 'npx'
      - '--args'
      - 'prisma,migrate,deploy'
      - '--max-retries'
      - '0'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'logivoice-migrate-dev'
      - '--project'
      - '${_DEPLOY_PROJECT_ID}'
      - '--region'
      - '${_REGION}'
      - '--wait'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'logivoice-api-dev'
      - '--project'
      - '${_DEPLOY_PROJECT_ID}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_REPO}/logivoice-api:${_TAG}'
      - '--region'
      - '${_REGION}'
      - '--no-allow-unauthenticated'

substitutions:
  _REGION: asia-northeast1
  _REPO: logivoice-docker
  _TAG: dev
  _AR_PROJECT_ID: ''
  _DEPLOY_PROJECT_ID: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM
