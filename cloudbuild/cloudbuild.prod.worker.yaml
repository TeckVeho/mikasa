# Cloud Build — worker image + deploy (production).
#
# Submit from LogiVoice root:
#   gcloud builds submit --config=cloudbuild/cloudbuild.prod.worker.yaml \
#     --substitutions=_AR_PROJECT_ID=...,_DEPLOY_PROJECT_ID=...,_WORKER_SERVICE_NAME=logivoice-worker-prod .

steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        IMG="${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_REPO}/logivoice-worker:${_TAG}"
        export DOCKER_CLI_EXPERIMENTAL=enabled
        docker buildx create --use --name cloudbuilder
        docker buildx build \
          --cache-from=type=registry,ref=${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_REPO}/logivoice-worker:buildcache \
          --cache-to=type=registry,ref=${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_REPO}/logivoice-worker:buildcache,mode=max \
          -f apps/worker/Dockerfile \
          -t "$$IMG" \
          --push \
          .
    dir: '.'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_WORKER_SERVICE_NAME}'
      - '--project'
      - '${_DEPLOY_PROJECT_ID}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${_AR_PROJECT_ID}/${_REPO}/logivoice-worker:${_TAG}'
      - '--region'
      - '${_REGION}'
      - '--no-allow-unauthenticated'

substitutions:
  _REGION: asia-northeast1
  _REPO: logivoice-docker
  _TAG: prod
  _AR_PROJECT_ID: ''
  _DEPLOY_PROJECT_ID: ''
  _WORKER_SERVICE_NAME: logivoice-worker-prod

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM
